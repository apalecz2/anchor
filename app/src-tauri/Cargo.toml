[package]
name = "anchor"
version = "0.3.0"
description = "Anchor: desktop app that extracts structured tables from scanned PDFs and images, fully on-device"
authors = ["Aiden Paleczny <aiden.paleczny@gmail.com>"]
license = "Elastic-2.0"
repository = "https://github.com/apalecz2/anchor"
homepage = "https://anchor.aidenpaleczny.com"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary's target name IS the installed executable name — Tauri names the main
# binary after this, not after `productName` in tauri.conf.json. Left implicit it
# would follow the package name (`anchor`), shipping a lowercase `anchor.exe`
# beside a product called Anchor; before 0.3.0 the package was named `app`, so
# released builds installed as `app.exe`. Capitalized here to match `productName`
# and the MSIX manifest's `Executable=` (docs/release.md §6.2). Tauri's own config
# schema recommends this over the `mainBinaryName` override.
[[bin]]
name = "Anchor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Scratch dirs/files for archive-extraction, hash-range, and partial-sweep tests.
tempfile = "3"
# Backdate file mtimes so the stale-`.part` sweep retention window is testable.
filetime = "0.2"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2"
# Persist & restore window size/position across launches
tauri-plugin-window-state = "2"
# Read the clipboard through the OS. `navigator.clipboard.readText()` is a *web*
# API, so the webview raises Chromium's "wants to see text and images copied to
# the clipboard" permission prompt — which a local desktop app has no business
# showing. Only reads go through here; writes never prompt.
tauri-plugin-clipboard-manager = "2"

# PDF to Image conversion (Requires downloading the pdfium binaries)
pdfium-render = "0.8.10" 

# Tesseract OCR wrapper
rusty-tesseract = "1.1.9"
# Pre-OCR preprocessing: grayscale + Lanczos upscale (see ocr.rs::preprocess_for_ocr)
image = "0.25.10"

# Setup / dependency download
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
# Async backoff between download retries, plus the pipeline executor's runtime needs.
# `rt`/`macros` were previously only reaching us through Tauri's feature unification —
# `spawn_blocking` and `select!` are used directly, so they are declared here rather
# than relying on another crate happening to enable them.
tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }
# CancellationToken: a pipeline step is a single 30-120s await, so cancellation has to
# be something `select!` can race against, not a flag polled between iterations.
tokio-util = "0.7"
sha2 = "0.10"
# Page images reach the model as `data:image/png;base64,...` chat content parts.
base64 = "0.22"
zip = "2"
# llama.cpp ships macOS releases as .tar.gz (Windows is .zip)
flate2 = "1"
tar = "0.4"

# Excel (XLSX) export
rust_xlsxwriter = "0.96"

